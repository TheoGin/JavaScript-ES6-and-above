<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Title</title>
  </head>
  <body>
    <script>
      async function getProvinces() {
        const requestConfig = {
          method: "GET",
          headers: {
            "Content-Type": "application/json",
            test: 1,
          },
        };

        // const response = await fetch("https://study.duyiedu.com/api/citylist", requestConfig); // 等价于下面两行
        // 除了使用基本的fetch方法，还可以通过创建一个Request对象来完成请求（实际上，fetch的内部会帮你创建一个Request对象）
        const request = new Request("https://study.duyiedu.com/api/citylist", requestConfig); // new Request(url地址, 配置)
        console.log(request); // Request {method: 'GET', url: 'https://study.duyiedu.com/api/citylist', headers: Headers, destination: '', referrer: 'about:client',…}

        const response = await fetch(request);
        const data = await response.json();
        console.log(data);
      }

      getProvinces();
    </script>
  </body>
</html>
