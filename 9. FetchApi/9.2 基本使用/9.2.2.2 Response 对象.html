<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Title</title>
  </head>
  <body>
    <script>
      async function getProvinces() {
        // function fetch(input: RequestInfo | URL, init?: RequestInit): Promise<Response>;
        const response = await fetch("https://study.duyiedu.com/api/citylist");
        console.log(response); // Response {type: 'cors', url: 'https://study.duyiedu.com/api/citylist', redirected: false, status: 200, ok: true, …}
        // 1. ok：boolean，当响应消息码在 200~299 之间时为 true，其他为 false
        // 2. status：number，响应的状态码

        if (response.ok) {
          // 3. text()：用于处理文本格式的 Ajax 响应。它从响应中获取文本流，将其读完，然后返回一个被解决为 string 对象的 Promise。
          /* const textData = await response.text(); // 因为文本可能很多，所以是异步的
          console.log(textData); // {"code":0,"msg":"","data":[{"value":"110000","label":"北京市"}, ... ]} */

          // 4. blob()：用于处理二进制文件格式（比如图片或者电子表格）的 Ajax 响应。它读取文件的原始数据，一旦读取完整个文件，就返回一个被解决为 blob 对象的 Promise。
          /* const blobPromise = await response.blob();
          console.log(blobPromise); // Blob {size: 153250, type: 'application/json'} */

          // 5. json()：用于处理 JSON 格式的 Ajax 的响应。它将 JSON 数据流转换为一个被解决为 JavaScript 对象的 promise。
          const jsonData = await response.json();
          console.log(jsonData); // code: 0, msg: '', data: Array(35)}

          // 6. redirect()：可以用于重定向到另一个 URL。它会创建一个新的 Promise，以解决来自重定向的 URL 的响应。
          // 如果服务器返回 301 或 302 状态码，浏览器会自动重定向到新的 URL。
        }
      }

      getProvinces();
    </script>
  </body>
</html>
