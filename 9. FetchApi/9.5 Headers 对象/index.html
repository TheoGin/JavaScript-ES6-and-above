<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Title</title>
  </head>
  <body>
    <button onclick="getProvinces()">获取省份数据</button>
    <script>
      function getCommonHeaders() {
        const headers = new Headers({
          a: 1,
          b: 2,
        });
        console.log(headers); // Headers {} --> 获取属性需要通过方法

        // 1. has(key: string): boolean;：检查请求头中是否存在指定的key值
        console.log(headers.has("content-type")); // false
        console.log(headers.has("a")); // true

        // 2. get(key: string): string | null;: 得到请求头中对应的key值
        console.log(headers.get("content-type")); // null
        console.log(headers.get("a")); // 1

        // 3. set(key: string, value: string): void;：修改对应的键值对
        headers.set("a", 3); // 有则修改，无则添加
        console.log(headers.get("a")); // 3
        headers.set('c', 100); // 有则修改，无则添加
        console.log(headers.get("c")); // 100

        // 4. append(name: string, value: string): void;：添加对应的键值对
        headers.append('d', 200); // 有则用逗号分隔追加，无则添加
        console.log(headers.get("d")); // 200
        headers.append('b', 6); // 有则用逗号分隔追加，无则添加
        console.log(headers.get("b")); // 2, 6

        // 5. keys(): HeadersIterator<string>;: 得到所有的请求头键的集合
        const keys = headers.keys();
        console.log(keys); // Headers Iterator {}
        console.log(Array.from(keys)); // [ 'a', 'b', 'c', 'd' ]

        // 6. values(): HeadersIterator<string>:到所有的请求头中的值的集合
        const values = headers.values();
        console.log(values); // Headers Iterator {}
        console.log(new Set(values)); // Set(4) {'3', '2, 6', '100', '200'}
        headers.values().forEach((value, index) => {
          console.log(`value: ${value} at index: ${index}`);
        });
        /*
         value: 3 at index: 0
         value: 2, 6 at index: 1
         value: 100 at index: 2
         value: 200 at index: 3
         *  */

        // 7. entries(): HeadersIterator<[string, string]>:到所有请求头中的键值对的集合
        const entries = headers.entries();
        console.log(entries); // Headers Iterator {}
        const map = new Map(entries);
        console.log(map); // Map(4) {'a' => '3', 'b' => '2, 6', 'c' => '100', 'd' => '200'}
        for (const entry of headers.entries()) {
          console.log(`key: ${entry[0]}: value: ${entry[1]}`);
        }
        /*
         key: a: value: 3
         key: b: value: 2, 6
         key: c: value: 100
         key: d: value: 200
         *  */
        return headers;
      }

      async function getProvinces() {
        const headers = getCommonHeaders();

        const response = await fetch("https://study.duyiedu.com/api/citylist", {
          /* headers: {
            a: 1,
            b: 2,
          }, // 会帮你 new Headers() */
          headers,
        });
        const result = await response.json();
        console.log(result); // {code: 0, msg: '', data: Array(35)}
      }
    </script>
  </body>
</html>
